name: testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s testes -t .
      - run: python -m atlas --db /tmp/a.db semear && python -m atlas --db /tmp/a.db auditar
